name: Build Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          set -e
          V=${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip"
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q tpl.tpz -d tpl
          mv tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Android build template + signing + editor settings
        run: |
          set -e
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build
          echo -n "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          keytool -genkey -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-${GODOT_VERSION}.tres; do
          cat > "$HOME/.config/godot/$f" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          sed -i 's/^          //' "$HOME"/.config/godot/editor_settings-*.tres

      - name: Add Godot OpenXR Vendors plugin (Quest support)
        run: |
          set -e
          mkdir -p plug addons
          gh release download -R GodotVR/godot_openxr_vendors --pattern "*.zip" --dir plug
          for z in plug/*.zip; do unzip -q -o "$z" -d plug/out; done
          D=$(find plug/out -type d -name godotopenxrvendors | head -1)
          cp -r "$D" addons/
          printf '\n[editor_plugins]\n\nenabled=PackedStringArray("res://addons/godotopenxrvendors/plugin.cfg")\n' >> project.godot
          ls addons/godotopenxrvendors

      - name: Import and export APK
        run: |
          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Quest" build/monkey_backrooms.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: monkey-backrooms-apk
          path: build/*.apk
